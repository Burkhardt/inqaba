<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="bgObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11110F"/>
      <stop offset="100%" stop-color="#1E1E1A"/>
    </linearGradient>

    <!-- Warm African Ochre & eGoli Gold Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE496"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8214"/>
    </linearGradient>

    <linearGradient id="goldShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCA832"/>
      <stop offset="50%" stop-color="#B88219"/>
      <stop offset="100%" stop-color="#7D5508"/>
    </linearGradient>

    <!-- Deep Warm Obsidian Body for Graphic Mural Contrast -->
    <linearGradient id="muralDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E18"/>
      <stop offset="50%" stop-color="#151511"/>
      <stop offset="100%" stop-color="#0E0E0A"/>
    </linearGradient>

    <linearGradient id="goldRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2BD"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Obsidian Base Ground -->
  <rect width="512" height="512" rx="104" fill="url(#bgObsidian)"/>

  <!-- Precision Framing Guides -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="#262620" stroke-width="2" stroke-dasharray="5 7"/>
  <circle cx="256" cy="256" r="192" fill="none" stroke="#383830" stroke-width="1.5"/>

  <!-- ASYMMETRICAL SOWETO TWIN TOWERS (DIVERGENT ARTISTIC MURALS) -->
  <g filter="url(#subtleGlow)">

    <!-- ======================================================== -->
    <!-- TOWER 2: EAST TOWER (Companion Tower, center x = 336)    -->
    <!-- Motif: The Golden Celestial & Organic Wave Canvas        -->
    <!-- Luminous Gold Body with Bold Obsidian Fluid Waves        -->
    <!-- ======================================================== -->
    <g id="eastTower">
      <!-- Hyperboloid Shell: slightly set back in perspective (y: 136..416) -->
      <!-- Lit Left Half -->
      <path d="M 336,136 
               L 294,136 
               C 303,170 305,196 300,214 
               C 290,252 274,336 264,416 
               L 336,416 Z" 
            fill="url(#goldLight)"/>

      <!-- Shaded Right Half -->
      <path d="M 336,136 
               L 378,136 
               C 369,170 367,196 372,214 
               C 382,252 398,336 408,416 
               L 336,416 Z" 
            fill="url(#goldShadow)"/>

      <!-- Flared Top Crown Opening -->
      <ellipse cx="336" cy="136" rx="42" ry="8.5" fill="#141412" stroke="url(#goldRim)" stroke-width="2"/>
      <ellipse cx="336" cy="136" rx="28" ry="5" fill="#0C0C0A"/>

      <!-- Foundation Plinth -->
      <path d="M 260,416 C 260,416 298,423 336,423 C 374,423 412,416 412,416 L 409,422 C 409,422 374,429 336,429 C 298,429 263,422 263,422 Z" 
            fill="#0C0C0A" stroke="#7A5A12" stroke-width="1.5"/>

      <!-- EAST MURAL ART: Flowing Waves, Celestial Arch & Ripple Strata (Fluid Rhythm) -->
      <!-- Crown: Continuous Wavy Ripple Frieze -->
      <path d="M 298,162 Q 307,152 316,162 T 334,162 T 352,162 T 374,162" 
            fill="none" stroke="#141412" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="295" y1="170" x2="377" y2="170" stroke="#F4F4F0" stroke-width="1.5"/>

      <!-- Upper Waist: The Great Soweto Sunburst / Radiant Horizon Arc -->
      <path d="M 292,230 C 314,204 358,204 380,230" 
            fill="none" stroke="#141412" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Inner Radiant Dot -->
      <circle cx="336" cy="220" r="7" fill="#141412"/>
      <circle cx="336" cy="220" r="3" fill="#F4F4F0"/>

      <!-- Mid-Body: Sweeping Dynamic Diagonal Sash (Township Movement) -->
      <path d="M 288,270 L 384,248 L 388,266 L 284,288 Z" fill="#141412" opacity="0.9"/>
      <line x1="290" y1="272" x2="382" y2="251" stroke="#F4F4F0" stroke-width="2" stroke-linecap="round"/>

      <!-- Lower Mid-Body: Double Fluid Wave Strata -->
      <path d="M 276,324 Q 306,314 336,324 T 396,324" 
            fill="none" stroke="#141412" stroke-width="4" stroke-linecap="round"/>
      <path d="M 274,334 Q 304,324 334,334 T 398,334" 
            fill="none" stroke="#F4F4F0" stroke-width="1.8" stroke-dasharray="8 5" stroke-linecap="round"/>

      <!-- Base Colonnade: Stepped Geometric Block Plinth -->
      <path d="M 266,380 L 406,380 L 404,396 L 264,396 Z" fill="#141412" opacity="0.92"/>
      <!-- Gold Rhythmic Dash Array at Base -->
      <line x1="270" y1="388" x2="288" y2="388" stroke="url(#goldRim)" stroke-width="3" stroke-linecap="round"/>
      <line x1="298" y1="388" x2="320" y2="388" stroke="url(#goldRim)" stroke-width="3" stroke-linecap="round"/>
      <line x1="330" y1="388" x2="352" y2="388" stroke="url(#goldRim)" stroke-width="3" stroke-linecap="round"/>
      <line x1="362" y1="388" x2="384" y2="388" stroke="url(#goldRim)" stroke-width="3" stroke-linecap="round"/>
      <line x1="394" y1="388" x2="402" y2="388" stroke="url(#goldRim)" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- ======================================================== -->
    <!-- TOWER 1: WEST TOWER (Hero Foreground, center x = 180)    -->
    <!-- Motif: The Iconic "Soweto Gold" Graphic Textile Canvas   -->
    <!-- Deep Obsidian Body with Intricate Gold & White Linework  -->
    <!-- ======================================================== -->
    <g id="westTower">
      <!-- Hyperboloid Shell: slightly forward and prominent (y: 128..418) -->
      <!-- Left Flank: Deep Obsidian Body with Gold Contour -->
      <path d="M 180,128 
               L 135,128 
               C 144,164 146,192 141,210 
               C 131,248 114,336 104,418 
               L 180,418 Z" 
            fill="url(#muralDark)" stroke="#D4AF37" stroke-width="1.5"/>

      <!-- Right Flank: Deep Obsidian Shadow Body -->
      <path d="M 180,128 
               L 225,128 
               C 216,164 214,192 219,210 
               C 229,248 246,336 256,418 
               L 180,418 Z" 
            fill="url(#muralDark)" stroke="#AA8214" stroke-width="1.5"/>

      <!-- Flared Top Crown Opening (Gold Trim on Black) -->
      <ellipse cx="180" cy="128" rx="45" ry="9.5" fill="#0E0E0C" stroke="url(#goldRim)" stroke-width="2.5"/>
      <ellipse cx="180" cy="128" rx="32" ry="6" fill="#000000"/>

      <!-- Foundation Plinth -->
      <path d="M 100,418 C 100,418 140,425 180,425 C 220,425 260,418 260,418 L 257,424 C 257,424 220,431 180,431 C 140,431 103,424 103,424 Z" 
            fill="#0C0C0A" stroke="#AA8214" stroke-width="1.8"/>

      <!-- WEST MURAL ART: Sharp Geometric Chevrons, Diamonds & Angular African Slashes -->
      <!-- Crown Frieze: Sharp Interlocking Gold Chevrons -->
      <path d="M 142,152 L 150,162 L 158,152 L 166,162 L 174,152 L 180,159 L 186,152 L 194,162 L 202,152 L 210,162 L 218,152" 
            fill="none" stroke="url(#goldLight)" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="140" y1="166" x2="220" y2="166" stroke="#F4F4F0" stroke-width="1.5"/>

      <!-- Waist: Karabo Poppy Geometric Diamond Medallion Array -->
      <polygon points="180,195 195,210 180,225 165,210" fill="url(#goldLight)"/>
      <polygon points="180,199 190,210 180,221 170,210" fill="#141412"/>
      <circle cx="180" cy="210" r="3.5" fill="#F4F4F0"/>

      <!-- Mid-Body: Rhythmic Gold Horizontal Strata Bands with African Cuts -->
      <path d="M 136,258 H 224 V 268 H 133 Z" fill="url(#goldLight)"/>
      <path d="M 148,258 L 156,268 M 172,258 L 180,268 M 196,258 L 204,268" stroke="#141412" stroke-width="2"/>

      <path d="M 126,298 H 234 V 308 H 122 Z" fill="url(#goldLight)"/>
      <path d="M 140,298 L 148,308 M 164,298 L 172,308 M 188,298 L 196,308 M 212,298 L 220,308" stroke="#141412" stroke-width="2"/>

      <!-- Lower Body: Monumental Diamond Star Crest -->
      <polygon points="180,332 196,350 180,368 164,350" fill="none" stroke="url(#goldLight)" stroke-width="2.5"/>
      <polygon points="180,338 190,350 180,362 170,350" fill="#F4F4F0"/>

      <!-- Basal Colonnade: Deep V-Strut Cooling Airflow Lattice -->
      <path d="M 112,398 L 126,376 L 140,398 L 154,376 L 168,398 L 182,376 L 196,398 L 210,376 L 224,398 L 238,376 L 252,398" 
            fill="none" stroke="url(#goldLight)" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="108" y1="404" x2="254" y2="404" stroke="#F4F4F0" stroke-width="1.8"/>
    </g>

    <!-- ======================================================== -->
    <!-- THE SOWETO SKYBRIDGE & SUSPENDED CONSENSUS PENDANT       -->
    <!-- Spanning across the two crowns with structural poise     -->
    <!-- ======================================================== -->
    <!-- Skybridge Girder Beam (Spanning dynamically from West crown y=128 to East crown y=136) -->
    <path d="M 180,128 L 336,136 L 336,142 L 180,134 Z" fill="#F4F4F0" stroke="#AA8214" stroke-width="1"/>
    <path d="M 180,134 L 336,142" stroke="url(#goldLight)" stroke-width="1.8"/>

    <!-- Structural Plumb-Line Suspension Cable -->
    <line x1="258" y1="138" x2="258" y2="188" stroke="#F4F4F0" stroke-width="2.2"/>

    <!-- THE CONSENSUS PENDANT MEDALLION (Suspended in the Asymmetrical Negative Space) -->
    <circle cx="258" cy="188" r="14" fill="#141412" stroke="url(#goldRim)" stroke-width="2.5"/>
    <circle cx="258" cy="188" r="6" fill="#F4F4F0"/>

    <!-- CARDINAL FINIALS -->
    <circle cx="256" cy="44" r="5" fill="#F4F4F0"/>
    <circle cx="256" cy="468" r="5" fill="#F4F4F0"/>

  </g>
</svg>