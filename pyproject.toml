[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inqaba"
version = "0.1.0"
description = "Shared Python filesystem, configuration, command, and media boundaries for RAIkeep."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Dr. Rainer Burkhardt" }]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["inqaba"]

[tool.hatch.build.targets.sdist]
include = ["inqaba", "README.md", "pyproject.toml", "doc", "assets"]
