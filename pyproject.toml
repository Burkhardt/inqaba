[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inqaba"
version = "4.7.0"
description = "Shared Python filesystem, configuration, command, and media boundaries for RAIkeep."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Dr. Rainer Burkhardt" }]
dependencies = []

[project.urls]
Repository = "https://github.com/Burkhardt/inqaba"
ReleaseNotes = "https://github.com/Burkhardt/RAIkeep/blob/main/doc/releases/v4.x/inqaba_RELEASE_NOTES_4.x.md"

[tool.hatch.build.targets.wheel]
packages = ["inqaba"]

[tool.hatch.build.targets.sdist]
include = ["inqaba", "README.md", "pyproject.toml", "doc", "assets", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.10", "ruff>=0.5", "build", "twine", "vikela[pylint]==4.6.7"]

[tool.vikela]
disable = []
